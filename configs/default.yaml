# Training configuration for DSUnet Lane Segmentation

# Dataset parameters
dataset:
  train_images_dir: "data/train"
  train_json_path:  "data/train/_annotations.coco.json"
  
  val_images_dir:   "data/valid"
  val_json_path:    "data/valid/_annotations.coco.json"
  
  test_images_dir:  "data/valid"
  test_json_path:   "data/valid/_annotations.coco.json"
  
  image_height: 256
  image_width: 512

# Model parameters
model:
  name: "DSUnet"
  in_channels: 3
  # Classes: 9 (including background id 0)
  num_classes: 9
  # Dropout rate for deep layers (enc4, bottleneck, dec4)
  dropout: 0.5
  # Width Scaling (Width Multiplier / Alpha)
  # 1.0: Baseline (6.00M params), 0.5: Lite (1.50M params), 0.25: Tiny (0.38M params)
  # You can configure either 'width_multiplier' or 'alpha'
  width_multiplier: 0.5

# Training hyperparameters
training:
  batch_size: 8
  epochs: 500
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 2
  device: "cuda" # or "cpu"
  save_dir: "checkpoints/"
  log_dir: "logs/"
  seed: 42
  early_stopping_patience: 50 # Stop training if val mIoU does not improve for 50 consecutive epochs

# Loss parameters
loss:
  type: "CrossEntropyLoss" # or "DiceLoss", "FocalLoss", or a combination
