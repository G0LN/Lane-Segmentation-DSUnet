# Training configuration for DSUnet Lane Segmentation

# Dataset parameters
dataset:
  train_images_dir: "data/dataset-classes-vehicle-lane-divider-no-video-frame.v1i.coco-segmentation/train"
  train_json_path:  "data/dataset-classes-vehicle-lane-divider-no-video-frame.v1i.coco-segmentation/train/_annotations.coco.json"
  
  val_images_dir:   "data/dataset-classes-vehicle-lane-divider-no-video-frame.v1i.coco-segmentation/valid"
  val_json_path:    "data/dataset-classes-vehicle-lane-divider-no-video-frame.v1i.coco-segmentation/valid/_annotations.coco.json"
  
  test_images_dir:  "data/dataset-classes-vehicle-lane-divider-no-video-frame.v1i.coco-segmentation/valid"
  test_json_path:   "data/dataset-classes-vehicle-lane-divider-no-video-frame.v1i.coco-segmentation/valid/_annotations.coco.json"
  
  image_height: 256
  image_width: 512

# Model parameters
model:
  name: "DSUnet"
  in_channels: 3
  # Classes: 11 (including background id 0)
  num_classes: 11

# Training hyperparameters
training:
  batch_size: 1
  epochs: 3
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  device: "cuda" # or "cpu"
  save_dir: "checkpoints/"
  log_dir: "logs/"
  seed: 42

# Loss parameters
loss:
  type: "CrossEntropyLoss" # or "DiceLoss", "FocalLoss", or a combination
